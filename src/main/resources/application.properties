# Spring Application name
spring.application.name=backend-villasystem

# Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rocko
spring.datasource.password=7rjzWVE9P7PQfb7
spring.datasource.url=jdbc:mysql://rocko.mysql.database.azure.com/rocko?useSSL=true&serverTimezone=UTC

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
